<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="MoonMQ">
  <defs>
    <linearGradient id="moon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8B8FF7"/>
      <stop offset="1" stop-color="#3B3DA8"/>
    </linearGradient>
    <mask id="crescent">
      <circle cx="122" cy="128" r="100" fill="#fff"/>
      <circle cx="166" cy="104" r="84" fill="#000"/>
    </mask>
    <clipPath id="lanes">
      <rect x="0" y="28" width="256" height="30" rx="4"/>
      <rect x="0" y="64" width="256" height="30" rx="4"/>
      <rect x="0" y="100" width="256" height="30" rx="4"/>
      <rect x="0" y="136" width="256" height="30" rx="4"/>
      <rect x="0" y="172" width="256" height="30" rx="4"/>
      <rect x="0" y="208" width="256" height="30" rx="4"/>
    </clipPath>
  </defs>
  <g clip-path="url(#lanes)">
    <rect width="256" height="256" fill="url(#moon)" mask="url(#crescent)"/>
  </g>
  <circle cx="200" cy="84" r="7" fill="#FBE0A6"/>
  <circle cx="176" cy="112" r="9" fill="#F8CB6C"/>
  <circle cx="148" cy="142" r="12" fill="#F5B841"/>
</svg>
